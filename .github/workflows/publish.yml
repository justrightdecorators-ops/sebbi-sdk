name: Build and test sebbi

# Every push builds and tests both clients.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Test the wheel
        run: |
          python -m pip install dist/*.whl
          cd /tmp && SEBBI_DISABLED=1 python -c "import sebbi; print(sebbi.seal(1,2,'ci'), sebbi.fingerprint({'a':1}))"

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: |
          SEBBI_DISABLED=1 node -e "const s=require('./index.cjs');s.seal(1,2,'ci').then(r=>console.log(r.id))"
          npm pack --dry-run
