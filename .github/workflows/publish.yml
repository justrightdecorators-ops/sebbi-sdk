name: Publish sebbi (PyPI)

# Every push to main builds and tests the Python client. A version that is not
# on PyPI yet is uploaded with Trusted Publishing (no stored token), which
# attaches a signed provenance attestation linking the release to this commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Test the wheel
        run: |
          python -m pip install dist/*.whl
          cd /tmp && SEBBI_DISABLED=1 python -c "import sebbi; print(sebbi.seal(1,2,'ci'), sebbi.fingerprint({'a':1}))"
      - name: Already on PyPI?
        id: check
        run: |
          V=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          CODE=$(curl -s -o /dev/null -w '%{http_code}' https://pypi.org/pypi/sebbi/$V/json)
          echo "version=$V http=$CODE"
          if [ "$CODE" = "200" ]; then echo "publish=no" >> $GITHUB_OUTPUT; else echo "publish=yes" >> $GITHUB_OUTPUT; fi
      - name: Publish to PyPI
        if: steps.check.outputs.publish == 'yes'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          attestations: true

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: |
          SEBBI_DISABLED=1 node -e "const s=require('./index.cjs');s.seal(1,2,'ci').then(r=>console.log(r.id))"
          npm pack --dry-run
