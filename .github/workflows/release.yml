name: Release to PyPI

# Publishes the Python client to PyPI with Trusted Publishing (no tokens).
# Runs on every change to python/ on main; uploads only when the version in
# python/pyproject.toml is not on PyPI yet, and only after every test passes.
# Each file gets a PyPI publish attestation naming this public repository,
# this workflow and the exact commit it was built from.

on:
  push:
    branches: [main]
    paths: ["python/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
          ls -l dist
          sha256sum dist/*
      - name: Test the wheel
        run: |
          python -m pip install "$(ls dist/*.whl)[otel]" opentelemetry-exporter-otlp-proto-common
          sebbi --help
          cp -r tests /tmp/sebbi-tests && cd /tmp && HOME=/tmp python -m unittest discover -s /tmp/sebbi-tests -v
      - name: Is this version already on PyPI?
        id: check
        run: |
          V=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          CODE=$(curl -s -o /dev/null -w '%{http_code}' https://pypi.org/pypi/sebbi/$V/json)
          echo "version=$V http=$CODE"
          if [ "$CODE" = "200" ]; then echo "publish=no" >> $GITHUB_OUTPUT; else echo "publish=yes" >> $GITHUB_OUTPUT; fi
      - name: Publish to PyPI
        if: steps.check.outputs.publish == 'yes'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
